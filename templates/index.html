<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos | Pymedesk</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main><header><div><small>PYMEDESK</small><h1>Gestión de pedidos</h1><p>Consulta y actualiza el estado de los pedidos.</p></div><span id="count"></span></header>
<!-- Mensajes de éxito o error. role="alert" hace que los lectores de pantalla lo anuncien. -->
<div id="message" class="alert" role="alert" hidden></div>
<section><div class="scroll"><table><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="orders"><tr><td colspan="5">Cargando pedidos…</td></tr></tbody></table></div></section></main>
<script>
const body = document.querySelector("#orders");
const count = document.querySelector("#count");
const message = document.querySelector("#message");
function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "alert " + type;
  message.hidden = false;
}
const money = new Intl.NumberFormat("es-CO", {style:"currency",currency:"COP",maximumFractionDigits:0});
async function loadOrders() {
  try {
    const response = await fetch("/api/orders");
    if (!response.ok) throw new Error();
    const orders = await response.json();
    count.textContent = orders.length + " pedidos";
    body.replaceChildren();
    for (const order of orders) {
      const row = document.createElement("tr");
      for (const value of [order.id, order.customer, money.format(order.total)]) {
        const cell = document.createElement("td"); cell.textContent = value; row.append(cell);
      }
      const status = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + order.status; badge.textContent = order.status;
      status.append(badge); row.append(status);
      const action = document.createElement("td");
      const button = document.createElement("button");
      button.textContent = "Marcar como enviado";
      // Solo los pedidos pendientes pueden enviarse. Es una ayuda visual: la regla real la valida el servidor.
      button.disabled = order.status !== "pendiente";
      button.onclick = () => ship(order.id, button);
      action.append(button); row.append(action); body.append(row);
    }
  } catch {
    body.innerHTML = '<tr><td colspan="5">No se pudieron cargar los pedidos. Recarga la página.</td></tr>';
  }
}
async function ship(id, button) {
  button.disabled = true;
  message.hidden = true;
  try {
    const response = await fetch(`/api/orders/${id}/ship`, {method:"POST"});
    // Lee el motivo del error que envía el servidor; si la respuesta no es JSON, usa un mensaje genérico.
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "No se pudo actualizar el pedido. Intenta de nuevo.");
    showMessage(`Pedido #${id} marcado como enviado.`, "success");
  } catch (error) {
    // fetch lanza TypeError cuando no hay conexión con el servidor.
    showMessage(error instanceof TypeError
      ? "No hay conexión con el servidor. Verifica que esté encendido e intenta de nuevo."
      : error.message);
  }
  // Recarga siempre para que la tabla muestre el estado real, también después de un error.
  await loadOrders();
}
loadOrders();
</script>
</body></html>
